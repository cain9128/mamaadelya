# ВАЖНО: root должен указывать на папку со сборкой (dist), а НЕ на корень репозитория.
# В корне репозитория лежит dev-версия index.html — она подключает /src/main.jsx
# (исходник на JSX), который браузер выполнить не может. Если отдавать корень репозитория,
# после git pull сайт открывается пустой белой страницей.
server {
    listen 80;
    server_name your-domain.ru www.your-domain.ru;
    root /var/www/youtube-preview-app/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Main SPA route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшируем: иначе после деплоя браузер будет ссылаться на старый бандл
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}

